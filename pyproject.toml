[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmrg-fte"
version = "0.1.0"
description = "Data & Model Reliability Guardian - Autonomous Digital FTE for data quality and ML model monitoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "DMRG Team" }
]
keywords = ["data-quality", "validation", "monitoring", "ml-ops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.5.0",
    "watchdog>=4.0.0",
    "apscheduler>=3.10.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    # Silver Tier dependencies
    "jsonschema>=4.21.0",
    "deepdiff>=7.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.33.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "humanize>=4.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
dmrg = "src.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
