# Dashboard Configuration
# DMRG-FTE Unified Monitoring Dashboard settings

# Auto-refresh settings
refresh:
  interval_seconds: 30
  show_countdown: true

# Timeline settings
timeline:
  max_events: 100
  default_time_range_hours: 24
  max_time_range_days: 30
  pagination_size: 50

# Performance settings
performance:
  max_results_cache: 1000
  cache_ttl_seconds: 30
  lazy_load_threshold: 50

# Theme colors (per Constitution 6.4)
theme:
  colors:
    excellent: "#00A67E"   # Green (90-100)
    good: "#FFB020"        # Yellow (70-89)
    fair: "#FF8C00"        # Orange (50-69)
    poor: "#DC3545"        # Red (0-49)
    background: "#FFFFFF"
    text: "#262730"
    muted: "#6B7280"

  # Trend indicators
  trend:
    improving: "arrow-up"
    stable: "arrow-right"
    degrading: "arrow-down"

  # Status badges
  badges:
    ok: "check-circle"
    failed: "x-circle"
    pending: "clock"

# User persona defaults
personas:
  executive:
    name: "Executive"
    icon: "briefcase"
    default_view: "summary"
    show_technical: false
  engineer:
    name: "Data Engineer"
    icon: "tool"
    default_view: "technical"
    show_technical: true
  compliance:
    name: "Compliance Officer"
    icon: "file-text"
    default_view: "audit"
    show_technical: false

# Severity display settings
severity:
  critical:
    label: "Critical"
    color: "#DC3545"
    icon: "alert-triangle"
  warning:
    label: "Warning"
    color: "#FFB020"
    icon: "alert-circle"
  info:
    label: "Info"
    color: "#6B7280"
    icon: "info"

# Layer configuration
layers:
  - name: "Data Validation"
    key: "bronze"
    tier: "Bronze"
  - name: "Schema Enforcement"
    key: "schema"
    tier: "Silver"
  - name: "Business Logic"
    key: "business"
    tier: "Silver"
  - name: "Freshness & SLA"
    key: "freshness"
    tier: "Silver"
  - name: "Model & Fairness"
    key: "model"
    tier: "Gold"
